# Pull-request and main-branch checks: secret scan, type checks and tests.
# Uses no repository secrets, so it is safe for pull requests from forks.
# Publishing lives in publish.yml and never runs for pull requests.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tar.gz

      - name: Scan every commit
        run: gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Workspace: core, arkiv, server, ensure-cli, site, web. Dependency install scripts stay off.
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck (core, server, CLI, scripts, tools)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Arkiv typecheck and tests
        run: pnpm arkiv:test

      - name: Typecheck web
        run: pnpm --filter @ensure/web typecheck

      - name: ENSure app (ensure-web) typecheck and build
        working-directory: ensure-web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc -b
          npx vite build

      - name: Backend syntax check
        working-directory: backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          for f in $(git ls-files 'src/*.js' 'src/**/*.js'); do node --check "$f"; done
