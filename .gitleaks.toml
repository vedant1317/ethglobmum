# Secret scan config, used by .github/workflows/ci.yml. Default gitleaks rules stay on;
# each exception below is scoped as narrowly as possible.
[extend]
useDefault = true

# Contract and wallet addresses are public on-chain data (e.g. ACCESS_CONTROLLER=0x…).
[[allowlists]]
description = "Public 20-byte addresses"
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']

# The build pipeline's tests feed deliberately fake secrets to prove they are refused.
[[allowlists]]
description = "Fake secrets in the secret-rejection tests"
paths = ['''^core/test/pipeline\.test\.ts$''']

# Arkiv entity keys are public record IDs. Only this labelled form is allowed: a bare
# 0x + 64 hex value elsewhere is still reported, because private keys look the same.
[[allowlists]]
description = "Arkiv entity keys in progress notes"
condition = "AND"
paths = ['''^docs/''']
regexTarget = "line"
regexes = ['''[Ee]ntity key:\s*`0x[0-9a-f]{64}`''']
